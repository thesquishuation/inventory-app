<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stockroom - Inventory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1b2430;--mute:#5d6b7a;--line:#d5dce3;--acc:#0f6b6b;--acc-ink:#fff;--good:#1d7a46;--bad:#b3392f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b232c;--ink:#e8edf2;--mute:#97a4b2;--line:#2f3b47;--acc:#3fb5b0;--acc-ink:#07201f;--good:#52c286;--bad:#ef7b70}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b232c;--ink:#e8edf2;--mute:#97a4b2;--line:#2f3b47;--acc:#3fb5b0;--acc-ink:#07201f;--good:#52c286;--bad:#ef7b70}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:1.25rem}
.stat span{color:var(--mute);font-size:.85rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.bar input{flex:1 1 200px;width:auto}
button{padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
button.del{color:var(--bad)}
.items{display:grid;gap:10px}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.thumb{width:64px;height:64px;border-radius:6px;background:var(--bg);border:1px solid var(--line);object-fit:cover;display:grid;place-items:center;color:var(--mute);font-size:.7rem;text-align:center}
.item h3{margin:0;font-size:1rem}
.meta{color:var(--mute);font-size:.85rem;margin:2px 0 8px;overflow-wrap:anywhere}
.nums{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem}
.nums div span{display:block;color:var(--mute);font-size:.75rem}
.good{color:var(--good);font-weight:700}.bad{color:var(--bad);font-weight:700}
.low{border-left:4px solid var(--bad)}
.act{display:flex;gap:8px;margin-top:10px}
.act button{padding:6px 12px;font-size:.88rem}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:28px 16px;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:3px}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.note{color:var(--mute);font-size:.8rem;margin-top:22px}
.picks{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.picks button{padding:0;border:2px solid var(--line);border-radius:6px;overflow:hidden;line-height:0}.picks button.sel{border-color:var(--acc)}.picks img{width:64px;height:64px;object-fit:cover}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Stockroom</h1>
  <p class="sub">Your inventory, costs and intended sale prices in one place.</p>
  <div id="auth" class="stat" hidden style="max-width:380px;padding:16px">
    <b style="font-size:1.1rem">Sign in to your inventory</b>
    <div style="margin:12px 0 8px"><label for="email">Email</label><input id="email" type="email" autocomplete="username"></div>
    <div style="margin-bottom:12px"><label for="pw">Password (6 or more characters)</label><input id="pw" type="password" autocomplete="current-password"></div>
    <div class="bar" style="margin:0"><button class="pri" id="signin">Sign in</button><button id="signup">Create account</button></div>
    <p id="authmsg" class="note" style="margin:10px 0 0"></p>
  </div>
  <div id="app" hidden>
  <div class="bar" style="justify-content:space-between;align-items:center">
    <span id="who" class="note" style="margin:0"></span>
    <span><span id="status" class="note" style="margin:0 10px 0 0"></span><button id="signout">Sign out</button></span>
  </div>
  <div class="stat" id="mig" hidden style="margin-bottom:12px"><span></span> <button id="migbtn" class="pri" style="margin-top:6px">Move them to my account</button></div>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="Search, or scan a UPC here" aria-label="Search">
    <button class="pri" id="scanbtn">Scan to add</button>
    <button id="add">Add item</button>
    <button id="exp">Export CSV</button>
    <button id="imp">Import CSV</button>
    <input id="file" type="file" accept=".csv" hidden>
  </div>
  <div class="items" id="list"></div>
  <p class="note">Your inventory is saved to your account online, so it works on any phone or computer where you sign in. Export CSV makes a backup copy.</p>
  </div>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <div class="grid">
      <div class="full"><label for="name">Item name</label><input id="name" required></div>
      <div><label for="upc">UPC</label><input id="upc" inputmode="numeric" placeholder="12 or 13 digits"><button type="button" id="fscan" style="margin-top:6px;padding:6px 10px;font-size:.85rem">Scan barcode</button> <button type="button" id="flook" style="margin-top:6px;padding:6px 10px;font-size:.85rem">Look up product</button></div>
      <div><label for="sku">SKU (optional)</label><input id="sku"></div>
      <div><label for="cat">Category</label><input id="cat"></div>
      <div><label for="qty">Quantity on hand</label><input id="qty" type="number" min="0" step="1" value="1"></div>
      <div><label for="cost">What you paid (each)</label><input id="cost" type="number" min="0" step="0.01"></div>
      <div><label for="retail">Retail price</label><input id="retail" type="number" min="0" step="0.01"></div>
      <div><label for="retailer">Retailer</label><input id="retailer" placeholder="e.g. Best Buy"></div>
      <div><label for="sale">Your sale price</label><input id="sale" type="number" min="0" step="0.01"></div>
      <div><label for="low">Low-stock alert at</label><input id="low" type="number" min="0" step="1" placeholder="optional"></div>
      <div class="full"><label for="img">Photo link (optional)</label><input id="img" type="url" placeholder="https://..."></div>
      <div class="full note" id="lmsg" hidden></div>
      <div class="full picks" id="picks" hidden></div>
      <div class="full"><label for="notes">Notes</label><textarea id="notes" rows="2"></textarea></div>
    </div>
    <div class="foot">
      <button type="button" id="cancel">Cancel</button>
      <button class="pri" id="savebtn" type="submit">Save item</button>
    </div>
  </form>
</dialog>

<dialog id="scan">
  <video id="vid" playsinline muted style="width:100%;border-radius:8px;background:#000"></video>
  <p id="smsg" class="note">Point the camera at a barcode.</p>
  <div style="margin-top:8px"><button type="button" id="photobtn" class="pri" style="width:100%">Choose or take a photo</button><input id="photo" type="file" accept="image/*" capture="environment" hidden></div>
  <div style="display:flex;gap:8px;margin-top:8px"><input id="manual" inputmode="numeric" placeholder="Or type the UPC"><button type="button" id="muse">Use code</button></div>
  <div class="foot"><button type="button" id="sclose">Close</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function(){
var KEY="stockroom.items.v1",items=[],editId=null;
var $=function(i){return document.getElementById(i)};
var CFG=window.APP_CONFIG||{},sb=null,user=null,BUCKET="photos",photoNote="";
var NUMS=["qty","cost","retail","sale","low"];
function busy(m){$("status").textContent=m||""}
function fail(e){busy("");alert((e&&e.message)||"Something went wrong. Please try again.")}
function fromRow(r){var o={id:r.id};F.forEach(function(f){var v=r[f];o[f]=NUMS.indexOf(f)>-1?(v==null?"":Number(v)):(v==null?"":v)});return o}
function toRow(o){var r={};F.forEach(function(f){var v=o[f];r[f]=NUMS.indexOf(f)>-1?(v===""||v==null?null:Number(v)):(v==null?"":String(v))});if(r.qty==null)r.qty=0;return r}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return(n===""||n==null||isNaN(n))?"-":"$"+Number(n).toFixed(2)}
function num(v){return v===""||v==null?"":Number(v)}
function render(){
  var t=$("q").value.trim().toLowerCase();
  var rows=items.filter(function(i){return !t||[i.name,i.upc,i.sku,i.cat].join(" ").toLowerCase().indexOf(t)>-1});
  var units=0,cost=0,val=0;
  items.forEach(function(i){var q=Number(i.qty)||0;units+=q;cost+=q*(Number(i.cost)||0);val+=q*(Number(i.sale)||0)});
  $("stats").innerHTML=[[items.length,"Items"],[units,"Units on hand"],[money(cost),"Stock value at cost"],[money(val),"Value at sale prices"]]
    .map(function(s){return'<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join("");
  if(!rows.length){$("list").innerHTML='<div class="empty">'+(items.length?"No items match your search.":"No items yet. Select Add item to enter your first product.")+'</div>';return}
  $("list").innerHTML=rows.map(function(i){
    var m=(i.sale!==""&&i.cost!=="")?Number(i.sale)-Number(i.cost):null;
    var pct=(m!==null&&Number(i.sale)>0)?" ("+Math.round(m/Number(i.sale)*100)+"%)":"";
    var low=i.low!==""&&i.low!=null&&Number(i.qty)<=Number(i.low);
    var th=i.img?'<img class="thumb" src="'+esc(i.img)+'" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=thumb>No photo</div>\'">':'<div class="thumb">No photo</div>';
    return'<div class="item'+(low?" low":"")+'">'+th+'<div><h3>'+esc(i.name)+'</h3><div class="meta">'
      +[i.upc&&"UPC "+esc(i.upc),i.sku&&"SKU "+esc(i.sku),i.cat&&esc(i.cat)].filter(Boolean).join(" | ")+'</div>'
      +'<div class="nums"><div><span>On hand</span>'+(Number(i.qty)||0)+(low?' <span class="bad" style="display:inline">low</span>':'')+'</div>'
      +'<div><span>Paid</span>'+money(i.cost)+'</div>'
      +'<div><span>Retail'+(i.retailer?" ("+esc(i.retailer)+")":"")+'</span>'+money(i.retail)+'</div>'
      +'<div><span>Your price</span><b>'+money(i.sale)+'</b></div>'
      +'<div><span>Profit each</span>'+(m===null?"-":'<span class="'+(m>=0?"good":"bad")+'" style="display:inline;font-size:inherit">'+money(m)+pct+'</span>')+'</div></div>'
      +(i.notes?'<div class="meta" style="margin-top:8px">'+esc(i.notes)+'</div>':'')
      +'<div class="act"><button data-e="'+i.id+'">Edit</button><button data-p="'+i.id+'">+1</button><button data-m="'+i.id+'">-1</button><button class="del" data-d="'+i.id+'">Delete</button></div></div></div>'}).join("");
}
var F=["name","upc","sku","cat","qty","cost","retail","retailer","sale","low","img","notes"];
function openForm(it){
  editId=it?it.id:null;
  F.forEach(function(f){$(f).value=it?(it[f]==null?"":it[f]):(f==="qty"?1:"")});
  $("dlg").showModal();$("name").focus();
}
$("add").onclick=function(){openForm(null)};
$("cancel").onclick=function(){$("dlg").close()};
async function keepPhoto(u){
  if(!u||!/^https?:\/\//i.test(u))return u;
  if(CFG.SUPABASE_URL&&u.indexOf(CFG.SUPABASE_URL+"/storage/")===0)return u;
  try{
    var r=await fetch("/.netlify/functions/image?u="+encodeURIComponent(u));
    if(!r.ok)throw new Error("no image");
    var b=await r.blob(),t=b.type||"image/jpeg",ext=(t.split("/")[1]||"jpg").replace("jpeg","jpg").replace(/[^a-z0-9]/g,"");
    var path=user.id+"/"+(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+"")+"."+ext;
    var up=await sb.storage.from(BUCKET).upload(path,b,{contentType:t,cacheControl:"31536000"});
    if(up.error)throw up.error;
    return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }catch(e){photoNote="Saved with the original photo link because a copy could not be made.";return u}
}
function delPhoto(u){var m=String(u||"").match(/\/object\/public\/photos\/(.+)$/);if(m){try{sb.storage.from(BUCKET).remove([decodeURIComponent(m[1])])}catch(e){}}}
$("form").onsubmit=async function(e){
  e.preventDefault();
  var btn=$("savebtn");btn.disabled=true;busy("Saving...");photoNote="";
  try{
    var o={};F.forEach(function(f){o[f]=$(f).value.trim()});
    o.img=await keepPhoto(o.img);
    var row=toRow(o),r;
    if(editId)r=await sb.from("items").update(row).eq("id",editId).select().single();
    else r=await sb.from("items").insert(row).select().single();
    if(r.error)throw r.error;
    var it=fromRow(r.data);
    if(editId){var k=items.findIndex(function(x){return x.id===editId});items[k]=it}else items.unshift(it);
    render();$("dlg").close();busy(photoNote);
  }catch(err){fail(err)}
  btn.disabled=false;
};
async function bump(it,d){
  try{var q=Math.max(0,(Number(it.qty)||0)+d);
    var r=await sb.from("items").update({qty:q}).eq("id",it.id);if(r.error)throw r.error;it.qty=q;render()}
  catch(e){fail(e)}
}
$("list").onclick=async function(e){
  var b=e.target.closest("button");if(!b)return;
  var id=b.dataset.e||b.dataset.p||b.dataset.m||b.dataset.d;
  var it=items.find(function(x){return x.id===id});if(!it)return;
  if(b.dataset.e){openForm(it);return}
  if(b.dataset.p){bump(it,1);return}
  if(b.dataset.m){bump(it,-1);return}
  if(!confirm('Delete "'+it.name+'"? This cannot be undone.'))return;
  try{var r=await sb.from("items").delete().eq("id",id);if(r.error)throw r.error;
    delPhoto(it.img);items=items.filter(function(x){return x.id!==id});render()}
  catch(err){fail(err)}
};
$("q").oninput=render;
function csvCell(v){v=String(v==null?"":v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
$("exp").onclick=function(){
  var csv=[F.join(",")].concat(items.map(function(i){return F.map(function(f){return csvCell(i[f])}).join(",")})).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="inventory.csv";a.click();
};
function parseCSV(s){var r=[],row=[],c="",q=false;
  for(var k=0;k<s.length;k++){var ch=s[k];
    if(q){if(ch==='"'){if(s[k+1]==='"'){c+='"';k++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===","){row.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&s[k+1]==="\n")k++;row.push(c);r.push(row);row=[];c=""}
    else c+=ch}
  if(c!==""||row.length){row.push(c);r.push(row)}return r}
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(){
  var f=this.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){
    var rows=parseCSV(String(rd.result)),h=rows.shift()||[];
    var added=rows.filter(function(r){return r.length>1||r[0]}).map(function(r){
      var o={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
      F.forEach(function(k){var v=r[h.indexOf(k)];o[k]=v==null?"":v});
      ["qty","cost","retail","sale","low"].forEach(function(k){o[k]=num(o[k])});return o}).filter(function(o){return o.name});
    if(added.length&&confirm("Add "+added.length+" items from this file?")){importRows(added)}
    else if(!added.length)alert("No items found. Use a file made with Export CSV.");
  };rd.readAsText(f);$("file").value="";
};
var stream=null,zx=null,scanCb=null,done=true;
function norm(raw){var c=String(raw).replace(/\D/g,"");if(c.length===13&&c[0]==="0")c=c.slice(1);
  if(!/^\d{8,14}$/.test(c))return"";
  var d=c.split("").map(Number),chk=d.pop(),sum=0;d.reverse().forEach(function(n,i){sum+=n*(i%2?1:3)});
  return(10-sum%10)%10===chk?c:""}
var timer=null,rdr=null,frames=0,cv=document.createElement("canvas");
function stopScan(){done=true;if(timer){clearInterval(timer);timer=null}
  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
  $("vid").srcObject=null;if($("scan").open)$("scan").close()}
function found(raw){var c=norm(raw);if(!c)return false;if(done)return true;
  if(navigator.vibrate){try{navigator.vibrate(60)}catch(e){}}
  var cb=scanCb;stopScan();cb(c);return true}
var lastErr="";
function initRdr(){if(rdr)return true;if(!window.ZXing)return false;
  rdr=new ZXing.MultiFormatReader();var h=new Map();
  h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.EAN_8]);
  h.set(ZXing.DecodeHintType.TRY_HARDER,true);rdr.setHints(h);return true}
function tryDecode(c){
  try{return rdr.decodeWithState(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)))).getText()}
  catch(e){if(!(e&&typeof e.getKind==="function"))lastErr=String(e&&e.message||e);return""}}
function zxTick(){
  var v=$("vid");if(done||!v.videoWidth)return;
  var W=v.videoWidth,H=v.videoHeight,cw=Math.round(W*.9),ch=Math.round(H*.5),sx=Math.round((W-cw)/2),sy=Math.round((H-ch)/2);
  cv.width=cw;cv.height=ch;
  cv.getContext("2d",{willReadFrequently:true}).drawImage(v,sx,sy,cw,ch,0,0,cw,ch);
  frames++;var t=tryDecode(cv);if(t)found(t);
  if(frames%8===0)$("smsg").textContent="Looking for a barcode... camera "+W+"x"+H+", checks: "+frames+(lastErr?", error: "+lastErr:"");
}
function photoCanvas(img,max,rot){
  var sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
  var c=document.createElement("canvas");c.width=rot?h:w;c.height=rot?w:h;
  var x=c.getContext("2d",{willReadFrequently:true});
  if(rot){x.translate(h/2,w/2);x.rotate(Math.PI/2);x.drawImage(img,-w/2,-h/2,w,h)}else x.drawImage(img,0,0,w,h);
  return c}
function decodePhoto(file){
  if(!file)return;
  if(!initRdr()&&!window.BarcodeDetector){$("smsg").textContent="The scanner library did not load. Type the UPC below.";return}
  $("smsg").textContent="Reading photo...";lastErr="";
  var img=new Image(),url=URL.createObjectURL(file);
  function fin(code){if(code)found(code);else $("smsg").textContent="Could not read a barcode in that photo. Try again closer, with the bars filling most of the width and no glare."+(lastErr?" Error: "+lastErr:"")}
  function viaZx(){if(!initRdr())return"";var code="";
    [1600,1000,2400].some(function(m){return[0,1].some(function(r){code=norm(tryDecode(photoCanvas(img,m,r)));return!!code})});return code}
  img.onload=function(){URL.revokeObjectURL(url);
    if(window.BarcodeDetector){try{
      new BarcodeDetector({formats:["ean_13","upc_a","ean_8"]}).detect(img).then(function(r){fin((r.length&&norm(r[0].rawValue))||viaZx())}).catch(function(){fin(viaZx())});return}catch(e){}}
    fin(viaZx())};
  img.onerror=function(){$("smsg").textContent="Could not open that photo."};
  img.src=url}
function nativeLoop(det){
  $("smsg").textContent="Looking for a barcode...";
  (function tick(){if(done)return;
    det.detect($("vid")).then(function(r){if(r.length&&found(r[0].rawValue))return;setTimeout(tick,150)})
    .catch(function(e){lastErr=String(e&&e.message||e);if(initRdr()&&!timer){timer=setInterval(zxTick,120)}else $("smsg").textContent="Scanner error: "+lastErr})})();
}
function startScan(cb){
  scanCb=cb;done=false;frames=0;lastErr="";$("manual").value="";$("smsg").textContent="Starting camera...";$("scan").showModal();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("smsg").textContent="Live camera is not available here. Use Choose or take a photo, or type the UPC below.";return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false}).then(function(s){
    stream=s;var v=$("vid");v.srcObject=s;
    try{s.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(function(){})}catch(e){}
    return v.play()}).then(function(){
    var det=null;
    if(window.BarcodeDetector){try{det=new BarcodeDetector({formats:["ean_13","upc_a","ean_8"]})}catch(e){det=null}}
    if(det)nativeLoop(det);
    else if(initRdr()){$("smsg").textContent="Looking for a barcode...";timer=setInterval(zxTick,120)}
    else $("smsg").textContent="The scanner library did not load. Use Choose or take a photo, or type the UPC below."
  }).catch(function(){$("smsg").textContent="Live camera was blocked. Use Choose or take a photo, or type the UPC below."});
}
function lookup(){
  var c=norm($("upc").value),m=$("lmsg"),pk=$("picks");
  pk.hidden=true;pk.innerHTML="";m.hidden=false;
  if(!c){m.textContent="Enter or scan a valid UPC first.";return}
  m.textContent="Looking up product...";
  fetch("/.netlify/functions/lookup?upc="+encodeURIComponent(c)).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})}).then(function(x){
    if(!x.ok){m.textContent=x.j.error||"Lookup failed. Type the details instead.";return}
    var p=x.j;
    if(!$("name").value)$("name").value=p.title;
    if(!$("cat").value&&p.category)$("cat").value=p.category;
    if(!$("img").value&&p.images[0])$("img").value=p.images[0];
    m.textContent="Found: "+p.title+(p.images.length?". Tap a photo to choose it.":". No photos available.");
    if(p.images.length>1){pk.hidden=false;pk.innerHTML=p.images.map(function(u){return'<button type="button" data-u="'+esc(u)+'"'+(u===$("img").value?' class="sel"':'')+'><img src="'+esc(u)+'" alt="Product photo option" loading="lazy"></button>'}).join("")}
  }).catch(function(){m.textContent="Lookup only works once the app is deployed with its lookup function."});
}
$("picks").onclick=function(e){var b=e.target.closest("button");if(!b)return;$("img").value=b.dataset.u;
  Array.prototype.forEach.call(this.children,function(x){x.className=x===b?"sel":""})};
function handleCode(c){
  var it=items.find(function(x){return x.upc===c});
  if(it){if(confirm('"'+it.name+'" is already in your inventory ('+(Number(it.qty)||0)+' on hand).\n\nOK = add 1 more. Cancel = edit this item.')){bump(it,1)}else openForm(it)}
  else{openForm(null);$("upc").value=c;lookup()}
}
$("scanbtn").onclick=function(){startScan(handleCode)};
$("fscan").onclick=function(){startScan(function(c){$("upc").value=c;lookup()})};
$("flook").onclick=lookup;
function useManual(){var c=norm($("manual").value);if(!c){$("smsg").textContent="That code does not look right. Check the digits.";return}found(c)}
$("muse").onclick=useManual;
$("photobtn").onclick=function(){$("photo").click()};
$("photo").onchange=function(){var f=this.files[0];this.value="";decodePhoto(f)};
$("manual").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();useManual()}};
$("sclose").onclick=function(){$("scan").close()};
$("scan").onclose=stopScan;
$("q").onkeydown=function(e){
  if(e.key!=="Enter")return;var c=norm(this.value);
  if(c){e.preventDefault();this.value="";render();handleCode(c)}};
$("upc").onkeydown=function(e){if(e.key==="Enter")e.preventDefault()};
async function loadCloud(){
  var r=await sb.from("items").select("*").order("created_at",{ascending:false});
  if(r.error)throw r.error;
  items=r.data.map(fromRow);render();checkMigrate();
}
async function importRows(a){
  busy("Importing...");
  try{var r=await sb.from("items").insert(a.map(toRow));if(r.error)throw r.error;await loadCloud();busy("")}
  catch(e){fail(e)}
}
function localItems(){try{var a=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}}
function checkMigrate(){
  var n=localItems().length;$("mig").hidden=!n;
  if(n)$("mig").querySelector("span").textContent=n+" item"+(n===1?"":"s")+" saved on this device can be moved to your account.";
}
$("migbtn").onclick=async function(){
  var a=localItems();if(!a.length)return;
  busy("Moving items...");
  try{var r=await sb.from("items").insert(a.filter(function(o){return o&&o.name}).map(toRow));if(r.error)throw r.error;
    try{localStorage.setItem(KEY+".moved",JSON.stringify(a));localStorage.removeItem(KEY)}catch(e){}
    await loadCloud();busy("Moved to your account.")}
  catch(e){fail(e)}
};
function showAuth(){user=null;items=[];$("app").hidden=true;$("auth").hidden=false;$("authmsg").textContent=""}
function enter(u){user=u;$("auth").hidden=true;$("app").hidden=false;$("who").textContent=u.email||"";loadCloud().catch(fail)}
async function doAuth(mode){
  var em=$("email").value.trim(),pw=$("pw").value,m=$("authmsg");
  if(!em||pw.length<6){m.textContent="Enter your email and a password of at least 6 characters.";return}
  m.textContent="Working...";
  try{
    var r=mode==="up"?await sb.auth.signUp({email:em,password:pw}):await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){m.textContent=r.error.message;return}
    if(!r.data.session){m.textContent="Account created. Check your email to confirm it, then sign in.";return}
    $("pw").value="";enter(r.data.session.user);
  }catch(e){m.textContent="Could not reach the sign-in service. Check your connection and try again."}
}
$("signin").onclick=function(){doAuth("in")};
$("signup").onclick=function(){doAuth("up")};
$("pw").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();doAuth("in")}};
$("signout").onclick=async function(){try{await sb.auth.signOut()}catch(e){}showAuth()};
async function init(){
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_KEY||!window.supabase){
    $("auth").hidden=false;$("authmsg").textContent="Setup needed: add your Supabase address and key to config.js.";return}
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);
  try{var s=await sb.auth.getSession();if(s.data.session)enter(s.data.session.user);else showAuth()}
  catch(e){showAuth()}
}
init();
})();
</script>
</body>
</html>
